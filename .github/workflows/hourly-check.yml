name: OLX hourly check

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedule is best-effort; an off-peak minute is usually less delayed than :00.
    - cron: "17 * * * *"

concurrency:
  group: olx-hourly-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run OLX checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 olx_position_checker.py | tee olx-output.txt

      - name: Add report to job summary
        if: always()
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f olx-output.txt ]; then
            cat olx-output.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "olx-output.txt was not created." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olx-report
          path: |
            olx-output.txt
            olx-report.txt
            my-ads-from-seller.txt
          if-no-files-found: ignore
